server:
  port: ${PORT:8080}

spring:
  application:
    name: tvmaze-middleware
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/tvmaze}
  data:
    mongodb:
      auto-index-creation: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

tvmaze:
  base-url: ${TVMAZE_BASE_URL:https://api.tvmaze.com}
  connect-timeout: 3s
  read-timeout: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
